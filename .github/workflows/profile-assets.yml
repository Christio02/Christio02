# Save as .github/workflows/profile-assets.yml in the Christio02/Christio02 repo
# (replaces the previous version). Renders github-readme-stats cards inside
# GitHub Actions and commits them to profile/, so nothing depends on the
# paused public Vercel instance. Also builds the contribution snake.
#
# Uses the METRICS_TOKEN secret you already created (classic PAT, read:user;
# add the `repo` scope if you want private contributions counted).

name: Profile assets

on:
  schedule:
    - cron: "17 3 * * *"   # daily, ~04:17 Oslo time
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-assets.yml"]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

env:
  THEME: theme=tokyonight&hide_border=true

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Christio02&show_icons=true&include_all_commits=true&count_private=true&${{ env.THEME }}
          path: profile/stats.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Christio02&layout=compact&langs_count=8&hide=jupyter%20notebook,html,css,scss,shaderlab,hlsl&${{ env.THEME }}
          path: profile/top-langs.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Pin — exo-worlds
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Christio02&repo=exo-worlds&${{ env.THEME }}
          path: profile/pin-exo-worlds.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Pin — portfolio
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Christio02&repo=portfolio&${{ env.THEME }}
          path: profile/pin-portfolio.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Pin — dungeons-and-developers
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Christio02&repo=dungeons-and-developers&${{ env.THEME }}
          path: profile/pin-dungeons-and-developers.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Pin — flappy
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Christio02&repo=flappy&${{ env.THEME }}
          path: profile/pin-flappy.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Remove old metrics output
        run: git rm -q --ignore-unmatch metrics.*.svg

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile
          git commit -m "Update README cards" || exit 0
          git pull --rebase
          git push

  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#7aa2f7&color_dots=#161b22,#1a3a5c,#2d5a8c,#4a7fc1,#7aa2f7

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
