# Save as .github/workflows/profile-assets.yml in the Christio02/Christio02 repo.
# Generates the stats/language/calendar SVGs (committed to main) and the
# contribution snake (pushed to the `output` branch). Nothing depends on a
# third-party server at view time, so the images can't go dark.
#
# One-time setup: create a classic personal access token with the `read:user`
# scope (add `repo` if you want private-repo activity counted), then add it in
# this repo under Settings → Secrets and variables → Actions as METRICS_TOKEN.

name: Profile assets

on:
  schedule:
    - cron: "17 3 * * *"   # daily, ~04:17 Oslo time
  workflow_dispatch:         # run manually from the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/profile-assets.yml"]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Stats card
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.stats.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, activity, community, repositories
          config_timezone: Europe/Oslo
          config_display: regular

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, shaderlab, hlsl, scss, jupyter notebook

      - name: Contribution calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.calendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#7aa2f7&color_dots=#161b22,#1a3a5c,#2d5a8c,#4a7fc1,#7aa2f7

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
